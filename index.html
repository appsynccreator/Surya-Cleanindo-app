  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(145deg,#0d3b22 0%,#166534 60%,#0f4a25 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;}

    .loading-text{font-size:13px;opacity:.7;margin-bottom:24px;}
    .btn{display:inline-block;background:white;color:#166534;font-weight:700;font-size:14px;padding:12px 28px;border-radius:10px;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:transform .2s,box-shadow .2s;}
