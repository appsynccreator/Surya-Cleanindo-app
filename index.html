  <meta name="theme-color" content="#166534">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --green-900: #0d3b22; --green-800: #14532d; --green-700: #166534; --green-600: #16a34a;
      --green-500: #22c55e; --green-400: #4ade80; --green-100: #dcfce7; --green-50: #f0fdf4;
      --blue-700: #1d4ed8; --blue-600: #2563eb; --blue-500: #3b82f6; --blue-100: #dbeafe;
      --red-600: #dc2626; --red-500: #ef4444; --red-100: #fee2e2;
      --amber-500: #f59e0b; --amber-100: #fef3c7;
      --teal-600: #0d9488; --teal-500: #14b8a6; --teal-100: #ccfbf1;
      --purple-600: #7c3aed; --purple-100: #ede9fe;
      --orange-500: #f97316; --orange-100: #ffedd5;
      --gray-900: #111827; --gray-800: #1f2937; --gray-700: #374151; --gray-600: #4b5563;
      --gray-500: #6b7280; --gray-400: #9ca3af; --gray-200: #e5e7eb; --gray-100: #f3f4f6;
      --gray-50: #f9fafb; --white: #ffffff;
      --sidebar-w: 240px; --radius: 10px; --radius-sm: 6px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.06);
      --font: 'Plus Jakarta Sans', sans-serif; --mono: 'JetBrains Mono', monospace;
      --transition: all .2s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:var(--font);background:var(--gray-50);color:var(--gray-900);font-size:13.5px;line-height:1.5;}
    input,select,textarea,button{font-family:inherit;font-size:inherit;}
    a{text-decoration:none;color:inherit;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px;}

    /* LOGIN */
    #loginPage{display:none;position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#0d3b22 0%,#166534 60%,#0f4a25 100%);align-items:center;justify-content:center;}
    #loginPage.active{display:flex;}
    .login-card{background:rgba(255,255,255,.97);border-radius:20px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 32px 64px rgba(0,0,0,.4);animation:fadeUp .4s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    .login-logo{text-align:center;margin-bottom:28px;}
    .login-logo .icon{display:inline-flex;width:64px;height:64px;background:linear-gradient(135deg,#166534,#22c55e);border-radius:16px;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 8px 20px rgba(22,101,52,.4);}
    .login-logo .icon i{font-size:28px;color:white;}
    .login-logo h1{font-size:20px;font-weight:800;color:#14532d;letter-spacing:-.5px;}
    .login-logo p{font-size:11px;color:var(--gray-500);margin-top:2px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:11px;font-weight:700;color:var(--gray-700);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
    .form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--gray-50);outline:none;transition:var(--transition);}
    .form-control:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(34,197,94,.15);background:white;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;transition:var(--transition);white-space:nowrap;}
    .btn-primary{background:linear-gradient(135deg,#166534,#16a34a);color:white;width:100%;padding:12px;}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(22,101,52,.35);}
    .alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;display:none;margin-bottom:14px;}
    .alert.show{display:flex;align-items:center;gap:8px;}
    .alert-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
    .alert-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}

    /* APP SHELL */
    #appShell{display:none;height:100%;flex-direction:column;}
    #appShell.active{display:flex;}
    .topbar{height:52px;background:white;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:100;}
    .topbar .menu-toggle{display:none;width:34px;height:34px;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--gray-600);font-size:17px;}
    .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#14532d;}
    .topbar .brand .b-icon{width:28px;height:28px;background:linear-gradient(135deg,#166534,#22c55e);border-radius:7px;display:flex;align-items:center;justify-content:center;}
    .topbar .brand .b-icon i{color:white;font-size:12px;}
    .topbar .spacer{flex:1;}
    .topbar .user-badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--gray-50);border-radius:99px;border:1px solid var(--gray-200);font-size:12px;cursor:pointer;transition:var(--transition);}
    .topbar .user-badge:hover{background:var(--green-50);border-color:var(--green-200);}
    .topbar .user-badge .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;}
    .avatar.owner{background:linear-gradient(135deg,#7c3aed,#a855f7);}
    .avatar.admin{background:linear-gradient(135deg,#166534,#22c55e);}
    .avatar.staff{background:linear-gradient(135deg,#0d9488,#14b8a6);}
    .btn-logout{padding:6px 12px;border:none;background:var(--gray-100);border-radius:6px;cursor:pointer;color:var(--gray-600);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}
    .btn-logout:hover{background:#fef2f2;color:#dc2626;}
    /* User profile popup */
    .user-popup{display:none;position:absolute;top:52px;right:12px;background:white;border:1px solid var(--gray-200);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.14);z-index:500;min-width:200px;overflow:hidden;animation:fadeUp .15s ease;}
    .user-popup.open{display:block;}
    .user-popup-header{padding:14px 16px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-bottom:1px solid var(--gray-100);}
    .user-popup-name{font-weight:800;font-size:13px;color:#14532d;}
    .user-popup-role{font-size:10px;color:var(--gray-500);margin-top:1px;}
    .user-popup-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;transition:var(--transition);font-size:13px;font-weight:500;color:var(--gray-700);}
    .user-popup-item:hover{background:var(--gray-50);}
    .user-popup-item.danger{color:#dc2626;}
    .user-popup-item.danger:hover{background:#fef2f2;}
    /* Confirm modal */
    .confirm-modal{background:white;border-radius:16px;width:100%;max-width:360px;box-shadow:0 24px 48px rgba(0,0,0,.2);animation:modalIn .2s ease;padding:24px;}
    .confirm-modal h3{font-size:16px;font-weight:800;margin-bottom:8px;}
    .confirm-modal p{font-size:13px;color:var(--gray-600);margin-bottom:20px;}
    .confirm-modal .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
    @media(max-width:768px){
      .topbar .btn-logout-desktop{display:none !important;}
    }

    .app-body{display:flex;flex:1;overflow:hidden;}
    .sidebar{width:var(--sidebar-w);background:white;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;transition:var(--transition);}

    /* SIDEBAR ICON COLORS */
    .nav-item i.c-green{color:#16a34a;}
    .nav-item i.c-teal{color:#0d9488;}
    .nav-item i.c-blue{color:#2563eb;}
    .nav-item i.c-amber{color:#d97706;}
    .nav-item i.c-purple{color:#7c3aed;}
    .nav-item i.c-red{color:#dc2626;}
    .nav-item i.c-orange{color:#ea580c;}
    .nav-item i.c-cyan{color:#0891b2;}

    /* Bottom nav */
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gray-200);padding:6px 4px;justify-content:space-around;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.08);}
    .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:5px 8px;font-size:9px;font-weight:600;color:var(--gray-500);transition:var(--transition);cursor:pointer;border-radius:10px;min-width:52px;}
    .bottom-nav-item i{font-size:19px;}
    .bottom-nav-item.active{color:var(--green-600);background:var(--green-50);}
    /* More menu drawer */

</head>

<script>
// ==================== STATE ====================
let currentUser = null, currentToken = null;
let pelangganCache = [], pricelistCache = {}, parameterCache = {}, jadwalCache = [], transaksiCache = [];
let jadwalPage = 1, transaksiPage = 1;
const PAGE_SIZE = 10;

const $ = id => document.getElementById(id);
const rupiah = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function fmtTgl(d){
  if(!d) return '—';
  const s=String(d);
  // yyyy-MM-dd HH:mm:ss or yyyy-MM-dd
  const parts=s.substring(0,10).split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return s.substring(0,10);
}
const toast = (msg, type='success') => {
  const el = document.createElement('div'); el.className = 'toast '+type;
  el.innerHTML = `<i class="fa-solid fa-${type==='success'?'circle-check':type==='error'?'circle-xmark':'triangle-exclamation'}"></i> ${msg}<span class="toast-close" onclick="this.parentElement.remove()">✕</span>`;
  $('toastContainer').appendChild(el); setTimeout(()=>el.remove(), 4000);
};
function showLoading(){ const o=document.createElement('div'); o.id='_loader'; o.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:9998;display:flex;align-items:center;justify-content:center;'; o.innerHTML='<div style="width:36px;height:36px;border:3px solid #dcfce7;border-top-color:#16a34a;border-radius:50%;animation:spin .7s linear infinite;"></div>'; document.body.appendChild(o); }
function hideLoading(){ const el=document.getElementById('_loader'); if(el) el.remove(); }
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }

async function call(fn, ...args){
  return new Promise(resolve => {
    google.script.run.withSuccessHandler(r => resolve(JSON.parse(r))).withFailureHandler(e => resolve({status:'error',message:e.message}))[fn](...args);
  });
}

// ==================== AUTH ====================
async function doLogin(){
  const u=$('loginUsername').value.trim(), p=$('loginPassword').value;
  if(!u||!p){ $('loginAlert').classList.add('show'); $('loginAlertMsg').textContent='Username & password wajib diisi.'; return; }
  $('btnLogin').disabled=true; $('btnLogin').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Memuat...';
  const res = await call('login', u, p);
  $('btnLogin').disabled=false; $('btnLogin').innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Masuk';
  if(res.status==='ok'){ currentUser=res.data; currentToken=res.data.token; localStorage.setItem('scms_token',currentToken); localStorage.setItem('scms_user',JSON.stringify(currentUser)); initApp(); }
  else { $('loginAlert').classList.add('show'); $('loginAlertMsg').textContent=res.message; }
}
function initApp(){
  $('loginPage').classList.remove('active'); $('appShell').classList.add('active');
  $('topName').textContent=currentUser.nama; $('topAvatar').textContent=currentUser.nama.charAt(0).toUpperCase(); $('topAvatar').className='avatar '+currentUser.role.toLowerCase();
  if($('popupName')) $('popupName').textContent=currentUser.nama;
  if($('popupRole')) $('popupRole').textContent=currentUser.role;
  applyRoleUI(); startClock(); buildMoreDrawer(); navigate('dashboard');
  document.querySelectorAll('.bottom-nav-item').forEach(el=>{
    if(el.classList.contains('nav-admin-owner-only') && !['Owner','Admin'].includes(currentUser.role)) el.style.display='none';
    if(el.classList.contains('nav-owner-only') && currentUser.role!=='Owner') el.style.display='none';
  });
  // Close user popup on outside click
  document.addEventListener('click', e=>{
    const popup=$('userPopup'); const badge=document.querySelector('.user-badge');
    if(popup&&badge&&!popup.contains(e.target)&&!badge.contains(e.target)) popup.classList.remove('open');
  });
}
function toggleUserPopup(){ $('userPopup')?.classList.toggle('open'); }

  const id='_confirmModal';
  const html=`<div id="${id}" class="modal-overlay open" onclick="if(event.target===this)this.remove()">
    <div class="confirm-modal">
      <h3>${opts.title||'Konfirmasi'}</h3>
      <p>${msg}</p>
      <div class="modal-btns">
        <button class="btn btn-sm btn-outline" onclick="document.getElementById('${id}').remove()">Batal</button>
        <button class="btn btn-sm ${opts.danger?'btn-danger':'btn-success'}" id="_confirmYes">${opts.yesLabel||'Ya'}</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('_confirmYes').onclick=()=>{ document.getElementById(id)?.remove(); onYes(); };
}

// ==================== NAVIGATION ====================
async function navigate(page){
  $('sidebar')?.classList.remove('open');
  closeMoreDrawer();
  // Role staff only allowed on dashboard & jadwal
  if(currentUser.role==='Staff' && !['dashboard','jadwal'].includes(page)) return;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.page===page));
  document.querySelectorAll('.bottom-nav-item').forEach(e=>e.classList.toggle('active',e.dataset.page===page));
  document.querySelectorAll('.more-item').forEach(e=>e.classList.toggle('active',e.dataset.page===page));
  if(page==='dashboard') await renderDashboard();
  else if(page==='jadwal') await renderJadwalPage();
  else if(page==='transaksi') await renderTransaksiPage();
  else if(page==='pelanggan') await renderPelangganPage();
  else if(page==='pricelist') await renderPricelistPage();
  else if(page==='parameter') await renderParameterPage();
  else if(page==='pengeluaran') await renderPengeluaranPage();
  else if(page==='laporan') await renderLaporanPage();
  else if(page==='users') await renderUsersPage();
}

// ==================== CLOCK ====================
function startClock(){
  const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  function tick(){
    const now=new Date(), el=$('topbarClock'); if(!el) return;
    el.innerHTML=`<span style="font-size:10px;">${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}</span><br><span style="font-family:var(--mono);font-weight:800;color:var(--green-700);">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}</span>`;
  }
  tick(); setInterval(tick,1000);
}

// ==================== PAGINATION ====================
function renderPagination(containerId, total, currentPage, onPageChange){
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const c = $(containerId); if(!c) return;
  if(totalPages <= 1){ c.innerHTML=''; return; }
  let btns = `<button class="page-btn" onclick="${onPageChange}(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;
  const start = Math.max(1, currentPage-2), end = Math.min(totalPages, currentPage+2);
  if(start>1) btns += `<button class="page-btn" onclick="${onPageChange}(1)">1</button>${start>2?'<span class="page-info">…</span>':''}`;
  for(let i=start;i<=end;i++) btns += `<button class="page-btn ${i===currentPage?'active':''}" onclick="${onPageChange}(${i})">${i}</button>`;
  if(end<totalPages) btns += `${end<totalPages-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="${onPageChange}(${totalPages})">${totalPages}</button>`;
  btns += `<button class="page-btn" onclick="${onPageChange}(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
  btns += `<span class="page-info">${((currentPage-1)*PAGE_SIZE)+1}–${Math.min(currentPage*PAGE_SIZE,total)} / ${total}</span>`;
  c.innerHTML = btns;
}

let _jadwalFiltered = [];
function filterJadwalTable(pg){
  jadwalPage = pg || 1;
  renderJadwalTableData();
}
function renderJadwalTableData(){
  const q = ($('jadwalSearch')?.value||'').toLowerCase();
  const sf = $('jadwalStatusFilter')?.value||'';
  const bf = $('jadwalBulanFilter')?.value||'';
  const tf = $('jadwalTahunFilter')?.value||'';
  _jadwalFiltered = jadwalCache.filter(j=>{
    const nama = (j.pelanggan?.Nama||j.Pelanggan_ID||'').toLowerCase();
    const matchQ = !q || nama.includes(q) || (j.ID||'').toLowerCase().includes(q);
    const matchS = !sf || j.Status===sf;
    const tglStr = String(j.Tanggal_Schedule||j.Tanggal||'');
    const matchB = !bf || tglStr.substring(5,7)===bf;
    const matchT = !tf || tglStr.substring(0,4)===tf;
    return matchQ && matchS && matchB && matchT;
  });
  const isAdminOwner = ['Admin','Owner'].includes(currentUser.role);
  const start = (jadwalPage-1)*PAGE_SIZE;
  const pageData = _jadwalFiltered.slice(start, start+PAGE_SIZE);
  const tbody = $('jadwalTableBody');
  if(tbody){
    tbody.innerHTML = pageData.length
      ? pageData.map((j,i)=>`
        <tr class="row-clickable" onclick="openJadwalEditModal('${escHtml(j.ID)}')">
          <td>${start+i+1}</td>
          <td>${String(j.Tanggal_Schedule||j.Tanggal||'').substring(0,10)}</td>
          <td>${j.Tanggal_Realisasi?'<span class="badge badge-green">'+fmtTgl(j.Tanggal_Realisasi)+'</span>':'<span class="badge badge-gray">—</span>'}</td>
          <td><b>${escHtml(j.pelanggan?.Nama||j.Pelanggan_ID)}</b></td>
          <td>${badgeJenis(j.Jenis_Layanan||'—')}</td>
          <td><span class="badge badge-blue">${escHtml(j.Kategori_Layanan||'—')}</span></td>
          <td>${escHtml(j.Periode||'—')}</td>
          <td>${badgeJadwalStatus(j.Status)}</td>
          ${isAdminOwner?`<td onclick="event.stopPropagation();">${getJadwalAdminBtns(j)}</td>`:''}
        </tr>`).join('')
      : `<tr><td colspan="${isAdminOwner?9:8}" class="empty-state">Belum ada jadwal</td></tr>`;
  }
  renderPagination('jadwalPagination', _jadwalFiltered.length, jadwalPage, 'filterJadwalTable');
  // Mobile
  const mc = $('jadwalCardContainer');
  if(mc){
    mc.innerHTML = pageData.map(j=>`
      <div class="data-card" onclick="openJadwalEditModal('${escHtml(j.ID)}')">
        <div class="card-header"><span class="card-title">${escHtml(j.pelanggan?.Nama||j.Pelanggan_ID)}</span>${badgeJadwalStatus(j.Status)}</div>
        <div class="card-row"><span class="card-row-label">Tgl Schedule</span><span>${String(j.Tanggal_Schedule||j.Tanggal||'').substring(0,10)}</span></div>
        ${j.Tanggal_Realisasi?`<div class="card-row"><span class="card-row-label">Realisasi</span><span class="badge badge-green">${fmtTgl(j.Tanggal_Realisasi)}</span></div>`:''}
        <div class="card-row"><span class="card-row-label">Layanan</span><span>${badgeJenis(j.Jenis_Layanan||'—')}</span></div>
        <div class="card-row"><span class="card-row-label">Kategori</span><span>${escHtml(j.Kategori_Layanan||'—')}</span></div>
        ${isAdminOwner?`<div class="card-actions" onclick="event.stopPropagation();">${getJadwalAdminBtns(j)}</div>`:''}
      </div>`).join('') || '<div class="empty-state">Belum ada jadwal</div>';
  }
}
function getJadwalAdminBtns(j){
  let b = '';
  if(j.Transaksi_ID) b += `<button class="btn btn-xs btn-outline" title="Cetak Struk" onclick="event.stopPropagation();openPrintModal('${escHtml(j.Transaksi_ID)}')">🖨</button> `;
  b += `<button class="btn btn-xs btn-danger" title="Hapus" onclick="event.stopPropagation();deleteJadwal('${escHtml(j.ID)}')"><i class="fa-solid fa-trash"></i></button>`;
  return b;
}

async function uploadFotoDetail(jadwalId, inputEl){
  const file=inputEl?.files[0]; if(!file) return;
  const statusEl=document.getElementById('fotoUploadStatus');
  if(statusEl) statusEl.textContent='⏳ Memproses...';
  try {
    const dataUrl = await new Promise((ok2,fail)=>{
      const rd=new FileReader();
      rd.onerror=()=>fail(new Error('Gagal baca'));
      rd.onload=ev=>{
        const img=new Image();
        img.onerror=()=>fail(new Error('Gagal load'));
        img.onload=()=>{
          const MAX=400; let w=img.width,h=img.height;
          if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
          const cv=document.createElement('canvas');
          cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          ok2(cv.toDataURL('image/jpeg',0.6));
        };
        img.src=ev.target.result;
      };
      rd.readAsDataURL(file);
    });
    const b64=dataUrl.split(',')[1];
    if(statusEl) statusEl.textContent='⏳ Menyimpan...';
    showLoading();
    const res=await call('uploadFotoJadwal',currentToken,jadwalId,b64,'image/jpeg');
    hideLoading();
    if(res.status==='ok'){
      toast('Foto tersimpan ✅');
      if(statusEl) statusEl.textContent='✅ Foto tersimpan';
      const j=jadwalCache.find(x=>x.ID===jadwalId); if(j) j.Foto_Dokumentasi=dataUrl;
    } else {
      if(statusEl) statusEl.textContent='❌ '+res.message;
      toast('Gagal: '+res.message,'error');
    }
  } catch(e2){
    hideLoading();
    if(statusEl) statusEl.textContent='❌ '+e2.message;
    toast('Error: '+e2.message,'error');
  }
}

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;">

      <div class="mobile-card-view" id="trxCardContainer"></div>

  if(transaksiCache.length){ _trxFiltered=transaksiCache; renderTrxTableData(); }
  const [trxRes, plgRes] = await Promise.all([
    call('getTransaksi',currentToken,{}),
    pelangganCache.length ? Promise.resolve({status:'ok',data:pelangganCache}) : call('getPelanggan',currentToken)
  ]);
  if(plgRes.status==='ok') pelangganCache=plgRes.data;
  if(trxRes.status==='ok') transaksiCache=trxRes.data;
  transaksiCache.sort((a,b)=>String(b.Tanggal_Masuk||'').localeCompare(String(a.Tanggal_Masuk||'')));

}
let _trxFiltered=[];
function applyTrxFilter(pg){
  transaksiPage = pg||1;
  const jenis=$('fJenis')?.value||'';
  const status=$('fStatus')?.value||'';
  const bulan=$('fBulan')?.value||'';
  const tahun=$('fTahun')?.value||'';
  _trxFiltered = transaksiCache.filter(t=>{
    const matchJ = !jenis || t.Jenis===jenis;
    const matchS = !status || t.Status_Bayar===status;
    const tglStr = String(t.Tanggal_Masuk||'');
    const matchB = !bulan || tglStr.substring(5,7)===bulan;
    const matchT = !tahun || tglStr.substring(0,4)===tahun;
    return matchJ && matchS && matchB && matchT;
  });
  renderTrxTableData();
}
async function loadTransaksiData(){
  showLoading();
  const [trxRes, plgRes] = await Promise.all([
    call('getTransaksi',currentToken,{}),
    pelangganCache.length ? Promise.resolve({status:'ok',data:pelangganCache}) : call('getPelanggan',currentToken)
  ]);
  hideLoading();
  if(plgRes.status==='ok') pelangganCache=plgRes.data;
  if(trxRes.status==='ok') transaksiCache=trxRes.data;
  transaksiCache.sort((a,b)=>String(b.Tanggal_Masuk||'').localeCompare(String(a.Tanggal_Masuk||'')));
  applyTrxFilter();
}
function renderTrxTableData(pg){
  transaksiPage = pg||transaksiPage||1;
  const start=(transaksiPage-1)*PAGE_SIZE;
  const pageData=_trxFiltered.slice(start,start+PAGE_SIZE);
  const tbody=$('trxTableBody');
  if(tbody){
    tbody.innerHTML=pageData.length
      ?pageData.map(t=>{
        const isPaid=t.Status_Bayar==='Lunas';
        return `<tr class="row-clickable" onclick="showTransaksiDetail('${escHtml(t.ID)}')">
          <td style="font-family:var(--mono);font-size:10px;">${escHtml(t.ID)}</td>
          <td>${String(t.Tanggal_Masuk).substring(0,10)}</td>
          <td>${escHtml(getPlgName(t.Pelanggan_ID))}</td>
          <td>${badgeJenis(t.Jenis)}</td>
          <td style="font-weight:700;">${rupiah(t.Total)}</td>
          <td>${badgeStatus(t.Status_Bayar)}</td>
          <td onclick="event.stopPropagation();">
            <button class="btn btn-xs btn-outline" onclick="openPrintModal('${escHtml(t.ID)}')">🖨</button>
            ${!isPaid?`<button class="btn btn-xs btn-info" onclick="toggleBayar('${escHtml(t.ID)}','${escHtml(t.Status_Bayar)}')">💰</button>`:''}
            <button class="btn btn-xs btn-danger" onclick="deleteTx('${escHtml(t.ID)}')">🗑</button>
          </td></tr>`;}).join('')
      :'<tr><td colspan="7" class="empty-state">Tidak ada transaksi</td></tr>';
  }
  renderPagination('trxPagination',_trxFiltered.length,transaksiPage,'renderTrxTableData');
  const cards=$('trxCardContainer');
  if(cards){
    cards.innerHTML=pageData.map(t=>`
      <div class="data-card" onclick="showTransaksiDetail('${escHtml(t.ID)}')">
        <div class="card-header"><span class="card-title">${escHtml(t.ID)}</span><span class="card-badge">${badgeJenis(t.Jenis)}</span></div>
        <div class="card-row"><span class="card-row-label">Tanggal</span><span>${String(t.Tanggal_Masuk).substring(0,10)}</span></div>
        <div class="card-row"><span class="card-row-label">Pelanggan</span><span>${escHtml(getPlgName(t.Pelanggan_ID))}</span></div>
        <div class="card-row"><span class="card-row-label">Total</span><span>${rupiah(t.Total)}</span></div>
        <div class="card-row"><span class="card-row-label">Status</span><span>${badgeStatus(t.Status_Bayar)}</span></div>
        <div class="card-actions" onclick="event.stopPropagation();">
          <button class="btn btn-xs btn-outline" onclick="openPrintModal('${escHtml(t.ID)}')">🖨</button>
          ${t.Status_Bayar!=='Lunas'?`<button class="btn btn-xs btn-info" onclick="toggleBayar('${escHtml(t.ID)}','${escHtml(t.Status_Bayar)}')">Bayar</button>`:''}
          <button class="btn btn-xs btn-danger" onclick="deleteTx('${escHtml(t.ID)}')">Hapus</button>
        </div>
      </div>`).join('')||'<div class="empty-state">Kosong</div>';
  }
}
async function toggleBayar(id,st){ const ns=st==='Lunas'?'Belum Bayar':'Lunas'; showLoading(); await call('updateStatusBayar',currentToken,id,ns); hideLoading(); loadTransaksiData(); }

function filterInvPlg(){
  const q=($('invPlgSearch')?.value||'').toLowerCase();
  const dd=$('invPlgDropdown'); if(!dd) return;
  const hits=q?pelangganCache.filter(p=>p.Nama.toLowerCase().includes(q)||String(p.Telepon||'').includes(q)):pelangganCache.slice(0,20);
  if(!hits.length){dd.style.display='none';return;}
  dd.innerHTML=hits.map(p=>`<div onclick="selectInvPlg('${escHtml(p.ID)}','${escHtml(p.Nama)}')" style="padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;" onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background=''"><b>${escHtml(p.Nama)}</b><span style="color:var(--gray-400);">${escHtml(p.Telepon||'')}</span></div>`).join('');
  dd.style.display='block';
}
function selectInvPlg(id,nama){
  $('invPlgId').value=id; $('invPlgSearch').value=nama; $('invPlgDropdown').style.display='none';
  $('invPlgSelected').innerHTML='✅ '+escHtml(nama);
}
function filterInvJadwal(){
  const q=($('invRefJadwalId')?.value||'').toLowerCase();
  const dd=$('invRefJadwalDropdown'); if(!dd) return;
  const jenis=$('invJenis')?.value||'';
  const filtered=jadwalCache.filter(j=>{
    if(j.Status!=='Completed') return false;
    if(jenis&&j.Jenis_Layanan!==jenis) return false;
    return !q||j.ID.toLowerCase().includes(q)||(j.pelanggan?.Nama||'').toLowerCase().includes(q);
  }).slice(0,15);
  if(!filtered.length){dd.style.display='none';return;}
  dd.innerHTML=filtered.map(j=>`<div onclick="selectInvJadwal('${escHtml(j.ID)}','${escHtml(j.pelanggan?.Nama||j.Pelanggan_ID)}','${escHtml(j.Pelanggan_ID)}')" style="padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--gray-100);" onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background=''">
    <b style="font-family:var(--mono);font-size:11px;">${escHtml(j.ID)}</b> — ${escHtml(j.pelanggan?.Nama||j.Pelanggan_ID)}
    <span class="badge badge-green">Completed</span>
    <div style="font-size:10px;color:var(--gray-400);">${String(j.Tanggal_Schedule||'').substring(0,10)}</div>
  </div>`).join('');
  dd.style.display='block';
}
function selectInvJadwal(id, nama, pelangganId){
  $('invRefJadwalId').value=id; $('invRefJadwalDropdown').style.display='none';
  // Auto-fill pelanggan
  if(pelangganId){
    const plg=pelangganCache.find(p=>p.ID===pelangganId);
    if(plg) selectInvPlg(plg.ID, plg.Nama);
  }
}
async function tarikDataJadwal(){
  const refId=$('invRefJadwalId')?.value?.trim(); if(!refId) return;
  const infoEl=$('invRefJadwalInfo'); if(infoEl) infoEl.innerHTML='⏳ Memuat...';
  showLoading(); const res=await call('getJadwalById',currentToken,refId); hideLoading();
  if(res.status!=='ok'){ if(infoEl) infoEl.innerHTML='<span style="color:red;">❌ '+escHtml(res.message)+'</span>'; return; }
  const j=res.data;
  if(j.Status!=='Completed'){ if(infoEl) infoEl.innerHTML='<span style="color:orange;">⚠️ Jadwal belum Completed</span>'; return; }
  if(j.Pelanggan_ID) selectInvPlg(j.Pelanggan_ID, j.pelanggan?.Nama||j.Pelanggan_ID);
  $('invJenis').value=j.Jenis_Layanan||'Cleaning';
  await invJenisChange();
  if(infoEl) infoEl.innerHTML=`<span style="color:var(--green-700);">✅ Data jadwal: <b>${escHtml(j.pelanggan?.Nama||j.Pelanggan_ID)}</b> — ${j.Jenis_Layanan}</span>`;
}

let _invKatCounter=0;

    <div class="form-group" style="width:110px;margin:0;"><label style="font-size:10px;">Harga (Rp)</label><input type="number" class="form-control inv-kat-harga" value="0" oninput="calcInvTotal()" min="0"></div>

function onInvKatPaketChange(sel){
  const val=parseFloat(sel.value)||0;
  const row=sel.closest('div[id^="invKat_"]');
  const hEl=row?.querySelector('.inv-kat-harga'); const nEl=row?.querySelector('.inv-kat-nama');

async function invJenisChange(){
  const jenis=$('invJenis').value;
  const jenisKey={Laundry:'laundry',Cleaning:'cleaning','Pest Control':'pest'}[jenis];
  if(!jenisKey) return;
  showLoading(); await loadPricelistCache(jenisKey); hideLoading();
  const prices=pricelistCache[jenisKey]||[];
  window._invPrices=prices; _invKatCounter=0;

function addInvRow(prices){
  prices=prices||window._invPrices||[];
  const tbody=$('invDetailTbody'); if(!tbody) return;
  const opts=prices.map(p=>`<option value="${escHtml(p.Nama_Item||p.Nama_Paket)}" data-harga="${p.Harga_Satuan||p.Harga}">${escHtml(p.Nama_Item||p.Nama_Paket)}</option>`).join('');
  const firstHarga=prices[0]?.Harga_Satuan||prices[0]?.Harga||0;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><select class="form-control" onchange="onInvItemChange(this)">${opts}</select></td>
    <td><input class="form-control" type="number" value="${firstHarga}" readonly style="width:80px;"></td>
    <td><input class="form-control" type="number" value="1" min="1" style="width:60px;" oninput="calcInvSubtotal(this)"></td>
    <td class="inv-sub" style="text-align:right;">${rupiah(firstHarga)}</td>
    <td><button class="btn btn-xs btn-danger" type="button" onclick="this.closest('tr').remove();calcInvTotal()"><i class="fa-solid fa-trash"></i></button></td>`;

function onInvItemChange(sel){ const opt=sel.options[sel.selectedIndex]; const row=sel.closest('tr'); row.querySelectorAll('input')[0].value=opt.dataset.harga||0; calcInvSubtotal(row.querySelectorAll('input')[1]); }
function calcInvSubtotal(inp){ const row=inp.closest('tr'); const h=parseFloat(row.querySelectorAll('input')[0].value)||0; const j=parseFloat(inp.value)||0; row.querySelector('.inv-sub').textContent=rupiah(h*j); calcInvTotal(); }
function calcInvTotal(){
  let t=0;
  document.querySelectorAll('.inv-sub').forEach(el=>t+=parseFloat(String(el.textContent).replace(/[^0-9]/g,''))||0);
  document.querySelectorAll('.inv-kat-harga').forEach(el=>t+=parseFloat(el.value)||0);
  const el=$('invTotal'); if(el) el.value=t;
  const disp=$('invTotalDisplay'); if(disp) disp.textContent=rupiah(t);
}
async function loadPricelistCache(jenis){ if(!jenis) return; const res=await call('getPricelist',currentToken,jenis); if(res.status==='ok') pricelistCache[jenis]=res.data; }
async function saveInv(){
  const jadwalId=$('invJadwalId').value, jenis=$('invJenis').value, pelangganId=$('invPlgId').value;
  if(!pelangganId){ toast('Pilih pelanggan','error'); return; }
  const details=[];
  if(jenis==='Laundry'){
    $('invDetailTbody')?.querySelectorAll('tr').forEach(tr=>{ const sel=tr.querySelector('select'),inps=tr.querySelectorAll('input'); if(!sel) return; const nama=sel.value,harga=parseFloat(inps[0]?.value)||0,jml=parseFloat(inps[1]?.value)||0; if(jml>0) details.push({Nama_Item:nama,Harga:harga,Jumlah:jml,Subtotal:harga*jml}); });
    if(!details.length){ toast('Tambahkan item laundry','error'); return; }
  } else {
    $('invKategoriList')?.querySelectorAll('div[id^="invKat_"]').forEach(div=>{ const nama=div.querySelector('.inv-kat-nama')?.value?.trim(); const harga=parseFloat(div.querySelector('.inv-kat-harga')?.value)||0; if(nama&&harga>0) details.push({Nama_Item:nama,Harga:harga,Jumlah:1,Subtotal:harga}); });
    if(!details.length){ toast('Tambahkan kategori layanan','error'); return; }
  }
  const txData={Pelanggan_ID:pelangganId,Jenis:jenis,Total:$('invTotal').value,Status_Bayar:$('invStatus').value,Catatan:$('invCatatan').value,Jadwal_ID:jadwalId||$('invRefJadwalId')?.value?.trim()};
  showLoading();
  const res=txData.Jadwal_ID?await call('createInvoiceFromJadwal',currentToken,txData,details):await call('saveTransaksi',currentToken,txData,details);
  hideLoading();
  if(res.status==='ok'){ toast('Invoice disimpan'); document.getElementById('invModalOverlay')?.remove(); if(jadwalId) renderJadwalPage(); else loadTransaksiData(); }
  else toast(res.message,'error');
}

async function loadLaporan(){
  const bln=$('fLapBulan')?.value||String(new Date().getMonth()+1).padStart(2,'0');

  showLoading(); const res=await call('getLaporan',currentToken,bln,thn); hideLoading();

  const colorMap={Laundry:{bg:'#ede9fe',tc:'#7c3aed'},Cleaning:{bg:'#dbeafe',tc:'#2563eb'},'Pest Control':{bg:'#fee2e2',tc:'#dc2626'}};
  const pctBar=(pct)=>{ const c=pct>=0?'#16a34a':'#dc2626'; const w=Math.min(Math.abs(pct),100); return `<div style="display:flex;align-items:center;gap:6px;"><div style="flex:1;background:#f3f4f6;border-radius:99px;height:8px;overflow:hidden;"><div style="width:${w}%;background:${c};height:100%;border-radius:99px;"></div></div><span style="font-size:11px;font-weight:700;color:${c};">${pct>=0?'+':''}${pct}%</span></div>`; };
  const perJenisHtml=(d.perJenis||[]).map(j=>{ const c=colorMap[j.jenis]||{bg:'#f3f4f6',tc:'#374151'}; return `<div style="border:1px solid var(--gray-200);border-radius:10px;padding:14px;background:white;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span style="padding:4px 12px;background:${c.bg};color:${c.tc};border-radius:99px;font-size:12px;font-weight:700;">${j.jenis}</span><span style="font-size:11px;color:var(--gray-500);">${j.jumlahTrx} transaksi</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><div style="background:var(--gray-50);border-radius:6px;padding:8px;"><div style="font-size:10px;color:var(--gray-500);font-weight:600;">PENDAPATAN</div><div style="font-size:14px;font-weight:800;color:#16a34a;">${rupiah(j.pendapatan)}</div><div style="font-size:10px;color:var(--gray-400);">Lunas: ${rupiah(j.lunas)}</div></div><div style="background:var(--gray-50);border-radius:6px;padding:8px;"><div style="font-size:10px;color:var(--gray-500);font-weight:600;">PENGELUARAN</div><div style="font-size:14px;font-weight:800;color:#dc2626;">${rupiah(j.pengeluaran)}</div></div></div><div style="border-top:1px solid var(--gray-100);padding-top:8px;"><div style="font-size:10px;color:var(--gray-500);font-weight:600;margin-bottom:4px;">UNTUNG / RUGI</div><div style="font-size:15px;font-weight:800;color:${j.untungRugi>=0?'#16a34a':'#dc2626'};margin-bottom:4px;">${j.untungRugi>=0?'+':''}${rupiah(j.untungRugi)}</div>${pctBar(j.persen)}</div></div>`; }).join('');
  $('laporanContent').innerHTML=`
    <div class="stats-row" style="margin-bottom:12px;">
      <div class="mini-stat"><div class="ms-icon" style="background:#dcfce7;color:#16a34a;"><i class="fa-solid fa-coins"></i></div><div><div class="ms-val" style="font-size:13px;">${rupiah(d.totalPendapatan||0)}</div><div class="ms-label">Total Pendapatan</div></div></div>
      <div class="mini-stat"><div class="ms-icon" style="background:#fee2e2;color:#dc2626;"><i class="fa-solid fa-arrow-trend-down"></i></div><div><div class="ms-val" style="font-size:13px;">${rupiah(d.totalPengeluaran||0)}</div><div class="ms-label">Total Pengeluaran</div></div></div>
      <div class="mini-stat"><div class="ms-icon" style="background:${(d.totalUntungRugi||0)>=0?'#dcfce7':'#fee2e2'};color:${(d.totalUntungRugi||0)>=0?'#16a34a':'#dc2626'};"><i class="fa-solid fa-scale-balanced"></i></div><div><div class="ms-val" style="font-size:13px;color:${(d.totalUntungRugi||0)>=0?'#16a34a':'#dc2626'};">${rupiah(d.totalUntungRugi||0)}</div><div class="ms-label">Untung/Rugi</div></div></div>
      <div class="mini-stat"><div class="ms-icon" style="background:#dbeafe;color:#2563eb;"><i class="fa-solid fa-check-circle"></i></div><div><div class="ms-val" style="font-size:13px;">${rupiah(d.totalLunas||0)}</div><div class="ms-label">Sudah Lunas</div></div></div>
    </div>
    <h3 style="font-size:14px;font-weight:700;margin-bottom:10px;">📈 Per Layanan</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:14px;">${perJenisHtml}</div>
    <h3 style="font-size:14px;font-weight:700;margin-bottom:8px;">🧾 Detail Transaksi</h3>
    <div class="card"><div class="card-body no-pad"><div class="table-wrap desktop-table"><table><thead><tr><th>ID</th><th>Tgl</th><th>Jenis</th><th>Total</th><th>Status</th></tr></thead><tbody>${(d.detail||[]).map(t=>`<tr><td style="font-family:var(--mono);font-size:10px;">${escHtml(t.ID)}</td><td>${String(t.Tanggal_Masuk).substring(0,10)}</td><td>${badgeJenis(t.Jenis)}</td><td>${rupiah(t.Total)}</td><td>${badgeStatus(t.Status_Bayar)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">Kosong</td></tr>'}</tbody></table></div></div></div>`;
}

// ==================== USERS ====================
async function renderUsersPage(){
  showLoading(); const res=await call('getUsers',currentToken); hideLoading();
  const users=res.status==='ok'?res.data:[];
  $('mainContent').innerHTML=`<h2 style="font-size:18px;margin-bottom:12px;">👥 Manajemen User</h2><button class="btn btn-sm btn-success" onclick="openUserForm()" style="margin-bottom:8px;">+ Tambah</button>
  <div class="card"><div class="card-body no-pad"><div class="table-wrap desktop-table"><table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Aksi</th></tr></thead><tbody>${users.map(u=>`<tr><td>${escHtml(u.Username)}</td><td>${escHtml(u.Nama_Lengkap)}</td><td>${u.Role}</td><td><button class="btn btn-xs btn-outline" onclick="openUserForm('${escHtml(u.ID)}')">✏️</button></td></tr>`).join('')}</tbody></table></div>
  <div class="mobile-card-view">${users.map(u=>`<div class="data-card"><div class="card-header"><span class="card-title">${escHtml(u.Username)}</span></div><div class="card-row"><span class="card-row-label">Nama</span><span>${escHtml(u.Nama_Lengkap)}</span></div><div class="card-row"><span class="card-row-label">Role</span><span>${u.Role}</span></div><div class="card-actions"><button class="btn btn-xs btn-outline" onclick="openUserForm('${escHtml(u.ID)}')">Edit</button></div></div>`).join('')}</div></div></div>`;
  window._userData=users;
}
function openUserForm(id=null){ const u=id?(window._userData||[]).find(x=>x.ID===id):{}; const html=`<div id="userModal" class="modal-overlay open" onclick="if(event.target===this)this.remove()"><div class="modal modal-sm"><div class="modal-head"><h3>${id?'Edit':'Tambah'} User</h3><button class="modal-close" onclick="document.getElementById('userModal').remove()">✕</button></div><div class="modal-body"><input type="hidden" id="fUserId" value="${u.ID||''}"><div class="form-group"><label>Username</label><input class="form-control" id="fUserUsername" value="${escHtml(u.Username||'')}"></div><div class="form-group"><label>Password</label><input class="form-control" type="password" id="fUserPass" placeholder="${id?'Kosongkan jika tidak diubah':''}"></div><div class="form-group"><label>Nama</label><input class="form-control" id="fUserNama" value="${escHtml(u.Nama_Lengkap||'')}"></div><div class="form-group"><label>Role</label><select class="form-control" id="fUserRole"><option>Staff</option><option>Admin</option><option>Owner</option></select></div></div><div class="modal-foot"><button class="btn btn-sm btn-outline" onclick="document.getElementById('userModal').remove()">Batal</button><button class="btn btn-sm btn-success" onclick="saveUser()">💾 Simpan</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend',html); if(u.Role) $('fUserRole').value=u.Role; }
async function saveUser(){ const d={ID:$('fUserId').value,Username:$('fUserUsername').value,Password:$('fUserPass').value,Nama_Lengkap:$('fUserNama').value,Role:$('fUserRole').value}; showLoading(); const res=await call('saveUser',currentToken,d); hideLoading(); if(res.status==='ok'){ toast('Disimpan'); document.getElementById('userModal')?.remove(); renderUsersPage(); } else toast(res.message,'error'); }

// ==================== PRINT & EMAIL ====================
async function openPrintModal(txId){
  showLoading();
  const [txRes,detRes]=await Promise.all([call('getTransaksi',currentToken,{}),call('getTransaksiDetail',currentToken,txId)]);
  hideLoading();
  const tx=(txRes.status==='ok'?txRes.data:[]).find(t=>t.ID===txId);
  if(!tx){ toast('Tidak ditemukan','error'); return; }
  const plg=pelangganCache.find(p=>p.ID===tx.Pelanggan_ID)||{};
  const details=detRes.status==='ok'?detRes.data:[];
  const detailList=details.map(d=>`<tr><td>${d.Nama_Item}</td><td>${d.Jumlah} x ${rupiah(d.Harga)}</td><td align="right">${rupiah(d.Subtotal)}</td></tr>`).join('');
  const html=`<div id="printOverlay" class="modal-overlay open" onclick="if(event.target===this)this.remove()">
    <div class="modal modal-sm">
      <div class="modal-head"><h3>🧾 Struk Invoice</h3><button class="modal-close" onclick="document.getElementById('printOverlay').remove()">✕</button></div>
      <div class="modal-body">
        <div id="thermalPrint" style="display:block;font-family:monospace;font-size:11px;max-width:300px;margin:0 auto;">
          <div style="text-align:center;"><b>🧹 SURYA CLEANINDO</b><br><span style="font-size:9px;">Laundry • Cleaning • Pest Control</span><br><br>${tx.ID}<br>${String(tx.Tanggal_Masuk).substring(0,16)}</div>
          <hr>Pelanggan: ${escHtml(plg.Nama||tx.Pelanggan_ID)}<br>Layanan: ${tx.Jenis}
          ${detailList?`<br><br><b>Detail:</b><table width="100%">${detailList}</table>`:''}
          <hr><b>Total: ${rupiah(tx.Total)}</b><br>Status: ${tx.Status_Bayar}
          <hr><small>Terima kasih!</small>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-sm btn-outline" onclick="document.getElementById('printOverlay').remove()">Tutup</button><button class="btn btn-sm btn-teal" onclick="sendEmail('${txId}')">📧 Email</button><button class="btn btn-sm btn-success" onclick="window.print()">🖨 Cetak</button></div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function sendEmail(txId){ showLoading(); const res=await call('kirimEmailStruk',currentToken,txId); hideLoading(); toast(res.status==='ok'?res.data:res.message, res.status==='ok'?'success':'error'); }

// ==================== INIT ====================
window.onload=()=>{
  // Jika dibuka dari GitHub Pages (bukan GAS), redirect ke aplikasi GAS
  if(typeof google === 'undefined' || typeof google.script === 'undefined'){
    window.location.replace('https://script.google.com/macros/s/AKfycbweuaL6O_JvMsnXJPBTuHMOhu-ngh2PaYRWUsup7tT6-Pch6iG-HiecAHaFYoHi_dh_/exec');
    return;
  }
  const u=localStorage.getItem('scms_user'), t=localStorage.getItem('scms_token');
  if(u&&t){ currentUser=JSON.parse(u); currentToken=t; call('getDashboard',currentToken).then(r=>{ if(r.status==='ok') initApp(); else localStorage.clear(); }); }
  $('loginPassword')?.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  window.addEventListener('resize',()=>{ if($('mainContent')&&currentUser){ const page=document.querySelector('.nav-item.active')?.dataset.page; if(page) navigate(page); } });
};

// ==================== SERVICE WORKER (PWA) ====================
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(reg=>{ console.log('SW registered:', reg.scope); })
      .catch(err=>{ console.log('SW failed:', err); });
  });
}
