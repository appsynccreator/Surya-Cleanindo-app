<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCMS - Test Koneksi GAS</title>
<style>
  body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#f5f5f5}
  h2{color:#166534}
  button{background:#166534;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;margin:5px}
  .result{margin-top:16px;padding:12px;border-radius:8px;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
  .ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
  .err{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
  .info{background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd}
  input{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;margin:4px 0 8px;box-sizing:border-box}
  label{font-size:13px;font-weight:600;color:#374151}
</style>
</head>
<body>
<h2>🔧 SCMS - Test Koneksi GAS</h2>
<p style="font-size:13px;color:#6b7280">Halaman ini untuk debug koneksi dari GitHub ke Google Apps Script</p>

<div>
  <label>Username</label>
  <input id="u" type="text" value="admin" placeholder="Username">
  <label>Password</label>
  <input id="p" type="password" placeholder="Password">
</div>

<button onclick="testPing()">1. Test Ping GAS</button>
<button onclick="testLogin()">2. Test Login</button>
<button onclick="testFetchRaw()">3. Lihat Raw Response</button>

<div id="out"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbweuaL6O_JvMsnXJPBTuHMOhu-ngh2PaYRWUsup7tT6-Pch6iG-HiecAHaFYoHi_dh_/exec';

function show(text, type='info') {
  document.getElementById('out').innerHTML = 
    `<div class="result ${type}">${text}</div>`;
}

async function testPing() {
  show('⏳ Mengirim ping ke GAS...', 'info');
  try {
    const url = GAS_URL + '?fn=ping&arg0=test';
    const res = await fetch(url, { method:'GET', credentials:'omit', cache:'no-store' });
    const text = await res.text();
    show(`Status HTTP: ${res.status}\nURL: ${url}\n\nResponse:\n${text}`, 
         text.includes('"status"') ? 'ok' : 'err');
  } catch(e) {
    show(`❌ GAGAL: ${e.message}\n\nKemungkinan:\n- CORS block\n- Network error\n- GAS URL salah`, 'err');
  }
}

async function testLogin() {
  const u = document.getElementById('u').value;
  const p = document.getElementById('p').value;
  if(!u||!p){ show('⚠️ Isi username dan password dulu', 'err'); return; }
  
  show('⏳ Mencoba login...', 'info');
  try {
    const params = new URLSearchParams({fn:'login', arg0:u, arg1:p});
    const url = GAS_URL + '?' + params;
    show(`Mengirim ke:\n${url}\n\n⏳ Menunggu...`, 'info');
    
    const res = await fetch(url, { method:'GET', credentials:'omit', cache:'no-store' });
    const text = await res.text();
    
    let display = `HTTP Status: ${res.status}\nContent-Type: ${res.headers.get('content-type')}\n\nResponse:\n${text}`;
    
    if(text.startsWith('<')) {
      display += '\n\n❌ GAS return HTML bukan JSON!\nArtinya: GAS belum di-redeploy dengan Code.js baru\nAtau: deployment settings salah (bukan "Anyone")';
      show(display, 'err');
    } else {
      try {
        const json = JSON.parse(text);
        display += `\n\nParsed: ${JSON.stringify(json, null, 2)}`;
        show(display, json.status === 'ok' ? 'ok' : 'err');
      } catch(e) {
        show(display + '\n\n❌ Bukan JSON valid', 'err');
      }
    }
  } catch(e) {
    show(`❌ Fetch GAGAL:\n${e.name}: ${e.message}\n\n` +
      `Kemungkinan penyebab:\n` +
      `1. CORS - browser block request\n` +
      `2. GAS URL tidak valid\n` +
      `3. Koneksi internet\n\n` +
      `Buka DevTools > Console untuk detail`, 'err');
  }
}

async function testFetchRaw() {
  show('⏳ Mengambil raw response...', 'info');
  try {
    const res = await fetch(GAS_URL, { method:'GET', credentials:'omit', cache:'no-store' });
    const text = await res.text();
    show(`HTTP ${res.status}\nURL Final: ${res.url}\n\nResponse (200 char):\n${text.substring(0,200)}`, 
         res.ok ? 'ok' : 'err');
  } catch(e) {
    show(`❌ ${e.name}: ${e.message}`, 'err');
  }
}
</script>
</body>
</html>
